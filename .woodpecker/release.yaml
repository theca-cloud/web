# Release candidates (dev) and releases (prod), once the checks passed: the
# `web` image (the app's build only, see the Dockerfile), and on prod the tag
# and the Gitea release. The version is package.json's, written by
# scripts/release.sh (see the release process in docs/CONTRIBUTING.md).
# Pushes filtered as the checks are (ci.yaml), manual runs always.
when:
  - event: push
    branch: [dev, prod]
    # Nothing built or tested changed: docs, the roadmap, local-only scripts,
    # repo housekeeping.
    path:
      exclude: ["**/*.md", "roadmap/**", "scripts/dev.sh", "scripts/install-hooks.sh", "scripts/release.sh", "LICENSE", ".gitignore", ".githooks/**", "docker-compose.yml", "cliff.toml"]
    # Not the release merge coming back into dev: prod just tested that very code.
    evaluate: 'not (CI_COMMIT_BRANCH == "dev" && CI_COMMIT_MESSAGE startsWith "Merge branch ''dev'' into prod")'
  - event: manual
    branch: [dev, prod]

depends_on: [ci]

variables:
  # core's CI image: sh, curl, jq, git.
  - &tools
    image: git.pband.ch/theca/ci-rust:1.98.0
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token

steps:
  # The image tags; on prod, refuses a version already released.
  - name: tags
    <<: *tools
    depends_on: []
    commands:
      - scripts/release-ci.sh tags

  - name: build
    image: node:24
    pull: true
    depends_on: []
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - npm ci
      - npm run build

  - name: image
    image: woodpeckerci/plugin-docker-buildx:5.0.0
    depends_on: [tags, build]
    settings:
      registry: git.pband.ch
      repo: git.pband.ch/theca/web
      platforms: linux/amd64,linux/arm64
      dockerfile: Dockerfile
      tags_file: .tags
      username:
        from_secret: gitea_user
      password:
        from_secret: gitea_token

  # The tag and the Gitea release.
  - name: publish
    <<: *tools
    depends_on: [image]
    when:
      - branch: prod
    commands:
      - scripts/release-ci.sh publish
