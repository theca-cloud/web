# Every branch (dev and prod included) and pull request, when something built
# or tested changed; manual runs always. Each step is a part of scripts/ci.sh,
# so a red step says what failed; steps share the workspace (node_modules/ and
# build/ carry over).
when:
  - event: [push, pull_request]
    # Nothing built or tested changed: docs, the roadmap, local-only scripts,
    # repo housekeeping.
    path:
      exclude: ["**/*.md", "roadmap/**", "scripts/dev.sh", "scripts/install-hooks.sh", "scripts/release.sh", "LICENSE", ".githooks/**", "docker-compose.yml", "cliff.toml", ".mcp.json", ".nvmrc", "components.json"]
    # Not the release merge coming back into dev: prod just tested that very code.
    evaluate: 'not (CI_COMMIT_BRANCH == "dev" && CI_COMMIT_MESSAGE startsWith "Merge branch ''dev'' into prod")'
  - event: manual

# A fixed workspace path: the server step reads its files (and the app's build)
# from it, and ${CI_WORKSPACE} isn't substituted in the YAML.
workspace:
  base: /woodpecker
  path: src

services:
  - name: postgres
    image: postgres:18
    environment:
      POSTGRES_USER: theca
      POSTGRES_PASSWORD: theca
      POSTGRES_DB: theca
      # The server refuses other collations.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
  # The server's emails, read by the tests from its API.
  - name: mailpit
    image: axllent/mailpit:v1.31.4

variables:
  - &node
    image: node:24
    pull: true
    environment:
      # @theca/client on the private registry (.npmrc), and the API types.
      GITEA_TOKEN:
        from_secret: gitea_token

steps:
  - name: install
    <<: *node
    depends_on: []
    commands:
      - npm ci

  - name: lint
    <<: *node
    depends_on: [install]
    commands:
      - scripts/ci.sh lint

  - name: build
    <<: *node
    depends_on: [install]
    commands:
      - scripts/ci.sh build

  # The server's files, in the workspace: its image has no shell to write
  # them, and services can't mount files. The keys generated: the server only
  # reads them (core 0.17.0).
  - name: server-files
    image: node:24
    depends_on: []
    commands:
      - mkdir -p data/secrets data/files data/files-fresh
      - printf postgres://theca:theca@postgres:5432/theca >data/secrets/database_url
      - printf postgres://theca:theca@postgres:5432/theca_fresh >data/secrets/database_url_fresh
      - head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' >data/secrets/server.key
      - head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' >data/secrets/data.key
      - head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' >data/secrets/server_fresh.key
      - head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' >data/secrets/data_fresh.key
      - chmod -R a+rwX data

  # The server the tests run against: core's latest release candidate, in the
  # background for the rest of the pipeline, serving the app's build as in
  # production (build/ is read per request: it can come after the start).
  - name: theca
    image: git.pband.ch/theca/core:0-rc
    pull: true
    detach: true
    depends_on: [server-files]
    environment:
      DATABASE_URL__FILE: /woodpecker/src/data/secrets/database_url
      SERVER_KEY__FILE: /woodpecker/src/data/secrets/server.key
      DATA_KEY__FILE: /woodpecker/src/data/secrets/data.key
      PUBLIC_URL: http://theca:8080
      WEB_DIR: /woodpecker/src/build
      SETUP_OPEN: "true"

  # A second server, never set up, for the setup wizard's tests: its database,
  # then the server (open setup: the tests can't read its logs).
  - name: fresh-db
    image: postgres:18
    depends_on: []
    environment:
      PGPASSWORD: theca
    commands:
      - until pg_isready -h postgres -U theca; do sleep 1; done
      - createdb -h postgres -U theca theca_fresh

  - name: theca-fresh
    image: git.pband.ch/theca/core:0-rc
    pull: true
    detach: true
    depends_on: [server-files, fresh-db]
    environment:
      DATABASE_URL__FILE: /woodpecker/src/data/secrets/database_url_fresh
      # Its own keys: both servers would generate them into the same empty files.
      SERVER_KEY__FILE: /woodpecker/src/data/secrets/server_fresh.key
      DATA_KEY__FILE: /woodpecker/src/data/secrets/data_fresh.key
      PUBLIC_URL: http://theca-fresh:8080
      SETUP_OPEN: "true"
      WEB_DIR: /woodpecker/src/build

  # Playwright's image, with its browsers: its tag is the @playwright/test
  # version in package.json.
  - name: test
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    depends_on: [lint, build, theca, theca-fresh]
    environment:
      THECA_TEST_SERVER: http://theca:8080
      THECA_TEST_APP: http://theca:8080
      THECA_TEST_FRESH: http://theca-fresh:8080
      THECA_TEST_FRESH_STORAGE: /woodpecker/src/data/files-fresh
      THECA_TEST_MAILPIT: http://mailpit:8025
      THECA_TEST_STORAGE: /woodpecker/src/data/files
    commands:
      - scripts/ci.sh test
